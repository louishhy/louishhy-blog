baseURL: 'https://blog.louishhy.com'
languageCode: 'en-us'
title: "Louis's blog"
theme: 'hugo-theme-stack'
copyright: "Louis Huang"
# Fix the black background issue
# See Github issue https://github.com/CaiJimmy/hugo-theme-stack/issues/695#issuecomment-1267181213
markup:
  highlight:
   noClasses: false

params:
  footer:
    since: 2024
  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 5
      - type: categories
      - type: tag-cloud
        params:
          limit: 20

menu:
  social:
    - identifier: github
      name: GitHub
      url: https://github.com/louishhy
      params:
        icon: brand-github
        newTab: true
    
    - identifier: rss
      name: RSS
      url: /index.xml
      params:
        icon: rss
        newTab: false
